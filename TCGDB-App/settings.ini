; TCG Database settings.
; Stop TCG Database first (icon by the clock > Stop TCG Database), change a value, then start it again.
;
; web_port   - the number in the address, as in http://localhost:8080. Change it if another program uses 8080.
; db_port    - used only inside this computer by the built-in database.
; lan_access - yes: other devices on your network can open the site (needed for a kiosk on another device).
;              no: only this computer can open it.

web_port=8080
db_port=3312
lan_access=yes
