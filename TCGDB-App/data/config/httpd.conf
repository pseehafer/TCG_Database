# Written by the TCG Database launcher every time it starts. Changes made here are overwritten.
ServerRoot "C:/xampp/htdocs/TCGDB-App1/TCGDB-App/runtime/apache"
Listen 0.0.0.0:8080
ServerName localhost:8080
ServerTokens Prod
ServerSignature Off
PidFile "C:/xampp/htdocs/TCGDB-App1/TCGDB-App/data/run/httpd.pid"
DefaultRuntimeDir "C:/xampp/htdocs/TCGDB-App1/TCGDB-App/data/run"

# Same connection settings XAMPP uses, which the program was tested with
Timeout 300
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
UseCanonicalName Off
HostnameLookups Off
AcceptFilter http none
EnableSendfile Off
EnableMMAP Off
ThreadsPerChild 150
MaxConnectionsPerChild 0

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule headers_module modules/mod_headers.so

LoadFile "C:/xampp/htdocs/TCGDB-App1/TCGDB-App/runtime/php/php8ts.dll"
LoadModule php_module "C:/xampp/htdocs/TCGDB-App1/TCGDB-App/runtime/php/php8apache2_4.dll"
PHPIniDir "C:/xampp/htdocs/TCGDB-App1/TCGDB-App/data/config"
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

# The program reads these to find the bundled database and the backup folder
SetEnv TCGDB_DB_HOST 127.0.0.1
SetEnv TCGDB_DB_PORT 3312
SetEnv TCGDB_BACKUP_DIR "C:\xampp\htdocs\TCGDB-App1\TCGDB-App\data\backups"

DocumentRoot "C:/xampp/htdocs/TCGDB-App1/TCGDB-App/app"
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "C:/xampp/htdocs/TCGDB-App1/TCGDB-App/app">
    Options None
    AllowOverride None
    Require all granted
</Directory>
DirectoryIndex homePage.html index.php
# Files that are part of the program but are not pages
<FilesMatch "\.(sql|md|bat|ini|log|gz|txt)$">
    Require all denied
</FilesMatch>

TypesConfig "C:/xampp/htdocs/TCGDB-App1/TCGDB-App/runtime/apache/conf/mime.types"
ErrorLog "C:/xampp/htdocs/TCGDB-App1/TCGDB-App/data/logs/web_error.log"
LogLevel warn
