# Written by the TCG Database launcher every time it starts. Changes made here are overwritten.
[mysqld]
basedir="C:/xampp/htdocs/TCGDB-App1/TCGDB-App/runtime/mariadb"
datadir="C:/xampp/htdocs/TCGDB-App1/TCGDB-App/data/db"
tmpdir="C:/xampp/htdocs/TCGDB-App1/TCGDB-App/data/tmp"
lc-messages-dir="C:/xampp/htdocs/TCGDB-App1/TCGDB-App/runtime/mariadb/share"
pid-file="C:/xampp/htdocs/TCGDB-App1/TCGDB-App/data/run/mariadb.pid"
log-error="C:/xampp/htdocs/TCGDB-App1/TCGDB-App/data/logs/database.log"
port=3312
bind-address=127.0.0.1
character-set-server=utf8mb4
collation-server=utf8mb4_general_ci
# Same as XAMPP, which the program was tested with
sql_mode=NO_ZERO_IN_DATE,NO_ZERO_DATE,NO_ENGINE_SUBSTITUTION
log_bin_trust_function_creators=1
# Sized for a few hundred thousand cards (XAMPP's defaults are much smaller)
innodb_buffer_pool_size=256M
innodb_log_file_size=64M
innodb_flush_log_at_trx_commit=1
innodb_lock_wait_timeout=50
max_allowed_packet=64M
max_connections=100

[client]
host=127.0.0.1
port=3312
user=root
default-character-set=utf8mb4
