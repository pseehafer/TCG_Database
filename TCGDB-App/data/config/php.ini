; Written by the TCG Database launcher every time it starts. Changes made here are overwritten.
[PHP]
engine=On
short_open_tag=Off
expose_php=Off
output_buffering=4096
zlib.output_compression=Off
implicit_flush=Off
max_execution_time=120
max_input_time=60
memory_limit=512M
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log="C:/xampp/htdocs/TCGDB-App1/TCGDB-App/data/logs/php_error.log"
post_max_size=128M
upload_max_filesize=128M
file_uploads=On
max_file_uploads=20
upload_tmp_dir="C:/xampp/htdocs/TCGDB-App1/TCGDB-App/data/tmp"
sys_temp_dir="C:/xampp/htdocs/TCGDB-App1/TCGDB-App/data/tmp"
default_socket_timeout=60
allow_url_fopen=On
default_charset="UTF-8"
extension_dir="C:/xampp/htdocs/TCGDB-App1/TCGDB-App/runtime/php/ext"
extension=curl
extension=mbstring
extension=openssl
extension=pdo_mysql
extension=zip

[Date]
date.timezone=America/Chicago

[Session]
session.save_handler=files
session.save_path="C:/xampp/htdocs/TCGDB-App1/TCGDB-App/data/tmp/sessions"

[curl]
curl.cainfo="C:/xampp/htdocs/TCGDB-App1/TCGDB-App/runtime/php/cacert.pem"
[openssl]
openssl.cafile="C:/xampp/htdocs/TCGDB-App1/TCGDB-App/runtime/php/cacert.pem"
